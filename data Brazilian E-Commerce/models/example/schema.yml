version: 2

models:
  - name: stg_orders
    description: Une ligne par commande, statuts et dates normalisés.
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
      - name: status
        tests:
          - accepted_values:
              values:
                - delivered
                - shipped
                - canceled
                - unavailable
                - invoiced
                - processing
                - created
                - approved

  - name: stg_order_items
    description: Une ligne par item de commande.
    columns:
      - name: order_id
        tests:
          - not_null
      - name: product_id
        tests:
          - not_null
      - name: seller_id
        tests:
          - not_null
      - name: price
        tests:
          - not_null

  - name: stg_order_payments
    description: Une ligne par moyen de paiement utilisé sur une commande (peut être multiple).
    columns:
      - name: order_id
        tests:
          - not_null
      - name: payment_value
        tests:
          - not_null

  - name: stg_customers
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null

  - name: stg_products
    columns:
      - name: product_id
        tests:
          - unique
          - not_null

  - name: stg_sellers
    columns:
      - name: seller_id
        tests:
          - unique
          - not_null

  - name: stg_geolocation
    columns:
      - name: zip_code_prefix
        tests:
          - unique
          - not_null

  - name: stg_order_reviews
    columns:
      - name: review_id
        tests:
          - not_null
      - name: order_id
        tests:
          - not_null
      - name: score
        tests:
          - accepted_values:
              values: [1, 2, 3, 4, 5]

  - name: fct_orders
    description: >
      Table de faits au grain "une ligne = une commande".
      Les items, paiements et reviews sont pré-agrégés pour éviter
      toute duplication de ligne.
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
      - name: customer_id
        tests:
          - not_null